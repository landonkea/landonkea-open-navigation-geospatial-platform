<!doctype html>
<html lang="en">
  <head>
    <!-- These few tags genuinely can't move into TypeScript, they
         have to exist before any script runs: charset must be known
         before the browser parses text, viewport must be set before
         the very first layout pass (setting it later causes a
         visible "flash" of wrongly-scaled content), and manifest is
         read directly by the browser, not by our code. Everything
         else (styles, the MapLibre stylesheet, the page title) is
         set from src/main.ts instead, see applyBaseStyles() there. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="manifest" href="/manifest.json" />
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
