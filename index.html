<!doctype html>
<html lang="en">
  <head>
    <!-- These few tags genuinely can't move into TypeScript, they
         have to exist before any script runs: charset must be known
         before the browser parses text, viewport must be set before
         the very first layout pass (setting it later causes a
         visible "flash" of wrongly-scaled content), and manifest is
         read directly by the browser, not by our code. Everything
         else (styles, the MapLibre stylesheet, the page title) is
         set from src/main.ts instead, see applyBaseStyles() there. -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <link rel="manifest" href="/manifest.json" />

    <!-- Open Graph/Twitter card tags, static and generic on purpose:
         most link-preview crawlers (Slack, iMessage, Twitter/X, etc.)
         don't execute JavaScript, so these have to be plain HTML
         present at parse time, the same reasoning as the tags above,
         and can't vary per-ride the way the page's real <title> does
         once src/main.ts runs (that would need server-side rendering,
         which this static app deliberately doesn't have). A generic
         "here's what this app is" preview beats no preview at all. -->
    <meta property="og:title" content="Open Navigation & Geospatial Platform" />
    <meta property="og:description" content="See everyone's live location on a shared map during a group event." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary" />
    <!-- No og:image/twitter:image yet, deliberately (found in review):
         the only image asset that exists is logo-placeholder.svg, and
         the major crawlers this tag is actually for (Twitter/X,
         iMessage) don't render SVG for a preview image and expect an
         absolute URL besides. A preview with no image is honest, a
         broken/invisible one claiming to work isn't. Add a real
         og:image once a real raster (PNG/JPG) client logo exists, see
         bikeTheme.logoUrl's own "placeholder, not real yet" note. -->
  </head>
  <body>
    <div id="map"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
