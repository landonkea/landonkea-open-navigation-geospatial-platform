# ── Keep-alive (staging) ──────────────────────────────────────────
# Same job as .github/workflows/keep-alive.yml, pinging staging's own
# separate Supabase project so its free tier doesn't auto-pause after
# 7 days idle, same reasoning as production's version, see that
# file's comments.
name: Keep Supabase project alive (staging)

on:
  schedule:
    - cron: "0 12 * * 1,4" # Mondays and Thursdays at 12:00 UTC
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping the staging Supabase project
        env:
          SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/rides?limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Supabase responded with HTTP $status"
          if [ "$status" -ge 500 ]; then
            echo "::warning::Staging Supabase project may be paused or unreachable (HTTP $status). If this persists, open the Supabase dashboard manually, opening it alone wakes a paused project back up."
            exit 1
          fi
