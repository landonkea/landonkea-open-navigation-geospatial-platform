# ── Uptime check ──────────────────────────────────────────────────
# WHAT: pings all three live hosts (dev/Cloudflare Pages, staging/
# Cloudflare Worker, the GitHub Pages fallback) on a schedule and opens
# a GitHub issue automatically if any of them stop responding, instead
# of that only being noticed the next time someone happens to open the
# app. Auto-closes the issue on the next check once everything's
# healthy again, so open issues always reflect real, current problems.
name: Uptime check

on:
  schedule:
    - cron: "*/15 * * * *" # every 15 minutes
  workflow_dispatch:

permissions:
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      # Needed even though this job never reads any source file: `gh`
      # infers which repository to target from the local git checkout,
      # and with no checkout step at all (this workflow doesn't
      # otherwise need the repo's files) every gh issue/label command
      # below failed outright with "fatal: not a git repository" (found
      # by actually running this workflow via workflow_dispatch after
      # shipping it, not just from the code review).
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Check all live hosts
        id: check
        run: |
          set -uo pipefail # NOT -e, a failed curl is an expected, handled case here, not a script bug

          declare -A hosts=(
            ["Dev (Cloudflare Pages)"]="https://landonkea-workingtitle.pages.dev/"
            ["Staging (Cloudflare Worker)"]="https://landonkea-open-navigation-geospatial-platform-staging.landon-kea.workers.dev/"
            ["GitHub Pages (fallback)"]="https://landonkea.github.io/landonkea-open-navigation-geospatial-platform/"
          )

          failures=""
          for name in "${!hosts[@]}"; do
            url="${hosts[$name]}"
            code=$(curl -s -o /dev/null -w "%{http_code}" -L --max-time 15 "$url" || echo "000")
            echo "$name ($url): HTTP $code"
            if [ "$code" != "200" ]; then
              failures="${failures}- **${name}**: HTTP ${code} (${url})\n"
            fi
          done

          if [ -n "$failures" ]; then
            echo "has_failures=true" >> "$GITHUB_OUTPUT"
            {
              echo "failures<<EOF"
              echo -e "$failures"
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            echo "has_failures=false" >> "$GITHUB_OUTPUT"
          fi

      # `gh issue create --label uptime` fails outright if that label
      # doesn't already exist on the repo (found in review: it doesn't
      # get auto-created, and nothing in this repo created it before
      # now), which would have silently broken the very first real
      # alert. --force makes this a no-op on every later run once the
      # label already exists, instead of erroring.
      - name: Ensure the "uptime" label exists
        if: steps.check.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh label create uptime --color d73a4a --description "Automated uptime check failures" --force

      # Only ever have ONE open uptime issue at a time (matched by the
      # "uptime" label), re-checking every 15 minutes should update
      # that one issue's story, not spam a new issue per failed check.
      #
      # FAILURES is passed via env:, not spliced into the script text
      # via ${{ }} (found in review, a known GitHub Actions
      # script-injection pattern): the host list is hardcoded today so
      # there's nothing actually exploitable yet, but interpolating a
      # step output straight into a run: block is unsafe in general,
      # env: keeps the value as data, never as executed shell text.
      - name: Open or update an issue on failure
        if: steps.check.outputs.has_failures == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILURES: ${{ steps.check.outputs.failures }}
        run: |
          existing=$(gh issue list --label uptime --state open --json number --jq '.[0].number // empty')
          now=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "Still failing as of ${now}:

          ${FAILURES}"
          else
            gh issue create --title "Uptime check failure" --label uptime --body "Automated uptime check failed at ${now}:

          ${FAILURES}

          This issue auto-closes once a later check finds everything healthy again."
          fi

      - name: Close the uptime issue if everything's healthy again
        if: steps.check.outputs.has_failures == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          existing=$(gh issue list --label uptime --state open --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "All hosts responded HTTP 200 as of $(date -u +"%Y-%m-%dT%H:%M:%SZ"), closing."
            gh issue close "$existing"
          fi
